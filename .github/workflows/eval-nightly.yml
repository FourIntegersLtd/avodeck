name: Nightly AI evaluation

on:
  schedule:
    - cron: "15 2 * * *"   # 02:15 UTC
  workflow_dispatch:

jobs:
  eval:
    # Off until the Bedrock (London) and Azure (UK South) accounts exist: set the repo variable EVAL_ENABLED=true.
    if: vars.EVAL_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: eval      # holds Bedrock (London) and Azure (UK South) credentials
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/api-install
      - run: make eval     # fails if precision < 0.95 or manual-reading share rises > 5 points
