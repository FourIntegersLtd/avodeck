name: Nightly AI evaluation

on:
  schedule:
    - cron: "15 2 * * *"   # 02:15 UTC
  workflow_dispatch:

jobs:
  eval:
    # Off until the Bedrock (London) and Azure (UK South) accounts exist: set the repo variable EVAL_ENABLED=true.
    if: vars.EVAL_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: eval      # holds Bedrock (London) and Azure (UK South) credentials
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/api-install
      - run: make eval     # fails if precision < 0.95 or manual-reading share rises > 5 points

  # The 900-page acceptance test (slice A) uses recorded OCR and model answers, so it needs no
  # cloud account: it runs every night on a local Supabase, apart from the live evaluation above.
  pipeline-acceptance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/api-install
      - uses: supabase/setup-cli@v1
        with: { version: latest }
      - run: supabase start -x studio,postgres-meta,edge-runtime,logflare,vector,realtime,supavisor,imgproxy
      - run: make eval-data      # builds the synthetic bundle and its recorded answers (not committed)
      - name: 900-page acceptance test
        env:
          RUN_SLOW: "1"
        run: cd api && poetry run pytest -q tests/repository/test_pipeline_acceptance.py
