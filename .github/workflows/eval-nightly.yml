name: Nightly AI evaluation

on:
  schedule:
    - cron: "15 2 * * *"   # 02:15 UTC
  workflow_dispatch:

jobs:
  eval:
    runs-on: ubuntu-latest
    environment: eval      # holds Bedrock (London) and Azure (UK South) credentials
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r backend/requirements-dev.txt
      - run: make eval     # fails if precision < 0.95 or manual-reading share rises > 5 points
