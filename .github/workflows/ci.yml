name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  spec:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Documents agree (tables, endpoints, state machines, behaviour index, data dictionary)
        run: python scripts/check_spec.py

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: supabase/setup-cli@v1
        with: { version: latest }
      - run: supabase start
      - run: pip install -r backend/requirements-dev.txt
      - run: make lint-backend
      - run: make test-backend
      - name: OpenAPI fuzzing (Schemathesis)
        run: make schemathesis
      - name: Red-then-green check
        if: github.event_name == 'pull_request'
        run: python scripts/check_red_green.py origin/${{ github.base_ref }}

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 9 }
      - uses: actions/setup-node@v4
        with: { node-version: "20", cache: pnpm, cache-dependency-path: frontend/pnpm-lock.yaml }
      - run: pnpm install --frozen-lockfile
        working-directory: frontend
      - run: pnpm lint && pnpm typecheck && pnpm vitest run --coverage
        working-directory: frontend
      - run: pnpm build
        working-directory: frontend
      - run: scripts/check_frontend_hosts.sh frontend/dist
      - name: Check generated API client is up to date
        run: make api-client && git diff --exit-code frontend/src/api openapi.json

  e2e:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 9 }
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - run: pnpm install --frozen-lockfile && pnpm exec playwright install --with-deps chromium
        working-directory: frontend
      - run: pnpm exec playwright test   # includes axe accessibility checks
        working-directory: frontend
