name: CI web

on:
  pull_request:
    paths: ["web/**", "openapi.json", "scripts/check_frontend_hosts.sh", ".github/workflows/ci-web.yml"]
  push:
    branches: [main]

# A newer push to a pull request cancels the older, now-pointless run.
# Runs on main are never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      web: ${{ steps.check.outputs.web }}
    steps:
      - uses: actions/checkout@v4
      - id: check
        run: echo "web=$([ -f web/package.json ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

  web:
    needs: detect
    if: needs.detect.outputs.web == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { package_json_file: web/package.json }
      - uses: actions/setup-node@v4
        with: { node-version: "20", cache: pnpm, cache-dependency-path: web/pnpm-lock.yaml }
      - run: pnpm install --frozen-lockfile
        working-directory: web
      # Report only (audit 15, BG-15): high and critical advisories are listed in the run summary and do not fail the build.
      - name: pnpm audit
        run: pnpm audit --audit-level=high 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"
        working-directory: web
        continue-on-error: true
      - run: pnpm lint && pnpm typecheck && pnpm vitest run --coverage --exclude src/capabilities/understand/Timeline.test.tsx
        working-directory: web
      # The timeline's 1,500-event time budget is measured alone and without coverage instrumentation.
      - run: pnpm vitest run src/capabilities/understand/Timeline.test.tsx
        working-directory: web
      - run: pnpm build
        working-directory: web
      - run: scripts/check_frontend_hosts.sh web/dist
      - uses: ./.github/actions/api-install
      - name: Check generated API client is up to date
        run: make api-client && git diff --exit-code web/src/foundation/platform-client openapi.json

  e2e:
    needs: [detect, web]
    if: needs.detect.outputs.web == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { package_json_file: web/package.json }
      - uses: actions/setup-node@v4
        with: { node-version: "20", cache: pnpm, cache-dependency-path: web/pnpm-lock.yaml }
      - run: pnpm install --frozen-lockfile && pnpm exec playwright install --with-deps chromium
        working-directory: web
      - run: pnpm exec playwright test   # includes axe accessibility checks
        working-directory: web
