checks:
  - key: zz_measurement_unanswered
    icon: flask
    rule: no_action_within
    applies_to: measurement
    flag: {field: unit, any_of: [zz_high, zz_low]}
    window_days: 3
    action_kinds: [session]
    label_spans: true
  - key: zz_session_length_recorded
    icon: visit
    rule: field_missing
    applies_to: session
    field: duration_minutes
    or_kinds: [measurement]
    scope: linked
    gentle: true
