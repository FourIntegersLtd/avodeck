# "Things to look at" checks for this specialty. Experts can switch any off or add their own.
# default_on: false means the check is offered but starts switched off.
# Each entry is an instance of a rule type implemented once in the engine; packs only choose and parameterise.
# Rule types: no_action_within, not_acknowledged_within, monitoring_overdue, not_reached_clinician,
#             actions_not_done, field_missing, not_followed_up
checks:
  - key: abnormal_result_no_action
    rule: no_action_within
    applies_to: result
    flag: {field: flag, any_of: [L, H, LL, HH, A]}   # laboratory abnormal flags
    window_days: 14
    action_kinds: [prescription, referral, task, consultation, phone_consultation]
    label_spans: true
  - key: referral_acknowledged
    rule: not_acknowledged_within
    applies_to: referral
    window_days: 42
    acknowledged_field: acknowledged_on
    acknowledged_kinds: [letter]
    acknowledges_field: acknowledges_referral_dated
  - {key: repeat_medicine_monitoring, rule: monitoring_overdue, applies_to: prescription, table: drug_monitoring}
  - key: ooh_reached_clinician
    rule: not_reached_clinician
    applies_to: [consultation, phone_consultation, home_visit]
    when: {setting: out_of_hours}
    window_days: 2
  - key: hospital_letter_actions
    rule: actions_not_done
    applies_to: letter
    field: actions_requested
    action_kinds: [prescription, referral, task]
    label_spans: true
  - key: examination_recorded
    rule: field_missing
    applies_to: consultation
    field: examination
    or_kinds: [examination]
    scope: linked
    gentle: true
  - key: safety_netting_recorded
    rule: field_missing
    applies_to: consultation
    field: safety_netting
    or_kinds: [safety_netting]
    scope: linked
    gentle: true
  - key: missed_appointment_followed_up
    rule: not_followed_up
    applies_to: missed_appointment
    window_days: 14
    followup_kinds: [consultation, phone_consultation, home_visit, task]
    default_on: false
# The drug monitoring table is country-specific and comes from the overlay pack (drug_monitoring.yaml).
