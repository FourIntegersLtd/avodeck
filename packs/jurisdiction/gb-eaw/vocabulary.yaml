# Words that change by jurisdiction. UI strings reference these keys, never the words directly.
# Party roles and instructing-party types are declared by the case-type pack; this file labels them.
party_roles:
  instructing_side: claimant
  other_side: defendant
  joint: jointly instructed
instructing_party_types:
  lawyer: solicitor
  insurer: insurer
  coroner: coroner
subject: claimant
court_bundle: trial bundle
court_tracks:
  small_claims: small claims track
  fast: fast track
  intermediate: intermediate track
  multi: multi-track
written_questions: questions from the other side
written_questions_one: question from the other side
written_questions_formal: Part 35 questions
expert_meeting: experts' discussion
expert_meeting_document: joint statement
report_rules_name: Part 35
declaration_name: statement of truth
subject_statuses:
  living: living
  deceased: has died
  minor: under 18
subject_representatives:
  deceased: personal representative
  minor: litigation friend
# Screen 08b: the email draft asking the instructing party for missing records. The expert edits
# and sends it. Slots: {case_reference}, {missing_items}, {clearer_copies}, {expert_name}, plus pack
# words such as {instructing_party}. Patient-free: no names, identifier numbers or dates of birth.
instructing_party_request:
  label: Ask the solicitor
  subject: "Medical records request: {case_reference}"
  body: |-
    Dear {instructing_party},

    Thank you for the records in this case ({case_reference}). Having gone through the bundle, I need the following before I can finish my report.

    Records that appear to be missing:
    {missing_items}

    Pages I need a clearer copy of:
    {clearer_copies}

    Kind regards,
    {expert_name}
# Screen 08b: paragraphs the draft carries before its sign-off. Slots: {pages} (page numbers, comma
# separated) and pack words such as {instructing_party}. Patient-free.
request_notes:
  quarantine: >-
    I have set aside these pages because they appear to belong to someone else: {pages}. Please check
    them and send the right records if any of them are part of this case.
  translation: >-
    These pages are not in English and need a certified translation before I can rely on them: {pages}.
    Please arrange this and send me the translated copies.
# Screens 03 and 04: the words the parties form uses.
# Screen 08b: the line the draft adds when the expert asks for more time if the records arrive late.
# Slots: {days} and pack words such as {instructing_party}. Patient-free.
request_extension:
  days: "14"
  text: >-
    If these records arrive late I may need up to {days} more days to finish my report. Please let me know
    whether the {instructing_party} can agree to this.
other_side_prompt: Who is the defendant?
other_side_example: For example, the practice or the doctor the claim is against
party_roles_plural:
  instructing_side: claimants
  other_side: defendants
  joint: jointly instructed parties
subject_status_hint: Say whether the claimant is living, has died or is under 18, so we ask about the right person.
party_name_ignore_words: [the, and, ltd, limited, plc, llp, nhs, trust, practice, surgery, medical, centre, health, dr, mr, mrs, ms, miss]
