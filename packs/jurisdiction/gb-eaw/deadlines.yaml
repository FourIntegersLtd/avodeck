# Deadline rules. calendar: calendar_days or business_days (business days count only the pack's
# working_week, skipping holidays.yaml). if_closed: next_working_day moves a calendar-day deadline that
# lands on a closed day (CPR 2.8(5)). Dates are worked out in the pack timezone.
# Court directions override these; the expert can edit any date. set_by: direction = no default date.
# Verify against the current CPR and Practice Direction 35 before launch.
deadlines:
  - key: written_questions             # questions put within 28 days of service of the report
    rule_ref: "CPR 35.6"
    days: 28
    calendar: calendar_days
    from: report_served
    if_closed: next_working_day
  - key: written_question_answers      # as directed, or within a reasonable time
    rule_ref: "CPR 35.6"
    set_by: direction
  - key: expert_meeting_signed
    rule_ref: "PD35 para 9"
    days: 7
    calendar: calendar_days
    from: discussion
    if_closed: next_working_day
  - key: expert_meeting_sent
    rule_ref: "PD35 para 9"
    days: 14
    calendar: calendar_days
    from: signing
    if_closed: next_working_day
  - key: trial
    rule_ref: "court directions"
    set_by: direction
