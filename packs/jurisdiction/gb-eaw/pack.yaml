code: gb-eaw
name: England and Wales
version: 2026.10.6
cell: uk
locale: en-GB
language: en
timezone: Europe/London
date_order: DMY            # used by the date normaliser; ambiguous dates are flagged, never guessed
currency: GBP
tax: VAT
working_week: [1, 2, 3, 4, 5]   # ISO weekdays the court office is open (Monday to Friday)
holidays:
  source: gov.uk/bank-holidays.json#england-and-wales   # snapshot in holidays.yaml; deadlines skip these days
registration_bodies:       # by profession (the specialty pack declares the profession)
  doctor: [GMC]
  nurse: [NMC]
  midwife: [NMC]
  physiotherapist: [HCPC]
  psychologist: [HCPC]
  dentist: [GDC]
default_retention_years: 6 # expert's default; configurable per case
quarantine_purge_days: 14        # a file that failed the virus scan is set aside this long, then purged
speech: {locale: en-GB}
legal_system: common law
court_tracks: [small_claims, fast, intermediate, multi]     # optional registry; hidden where a jurisdiction has none
written_question_classifications: [clarifies, goes_beyond]  # optional registry for written questions
