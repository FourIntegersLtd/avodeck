# Schemathesis settings for `make -C api schemathesis` (CI starts the API on the local Supabase first).

# Random one-time tokens (password reset, email change) are never valid, so schema-valid input is
# not expected to be accepted.
[checks]
positive_data_acceptance.enabled = false

# DELETE /v1/me/sessions/revoke-all reaches DELETE /v1/me/sessions/{session_id} (the path template
# matches any word) and is refused there (401 signed out, 422 not a session id), not with 405.
[[operations]]
include-path = "/v1/me/sessions/revoke-all"
checks.unsupported_method.enabled = false

# The same for these action routes: each path also matches a sibling `{id}` template
# (e.g. PATCH /v1/cases/{case_id}/questions/{question_id}), which refuses it (401 signed out,
# 404 or 422 not an id) before the method is looked at, so they never answer 405.
[[operations]]
include-path = "/v1/cases/duplicate-check"
checks.unsupported_method.enabled = false

[[operations]]
include-path = "/v1/cases/{case_id}/documents/append"
checks.unsupported_method.enabled = false

[[operations]]
include-path = "/v1/cases/{case_id}/fact-links/suggest"
checks.unsupported_method.enabled = false

[[operations]]
include-path = "/v1/cases/{case_id}/findings/rerun"
checks.unsupported_method.enabled = false

[[operations]]
include-path = "/v1/cases/{case_id}/pages/unreadable"
checks.unsupported_method.enabled = false

[[operations]]
include-path = "/v1/cases/{case_id}/questions/confirm-all"
checks.unsupported_method.enabled = false

[[operations]]
include-path = "/v1/cases/{case_id}/questions/read-again"
checks.unsupported_method.enabled = false
