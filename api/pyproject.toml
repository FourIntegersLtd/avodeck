[project]
name = "avodeck-api"
version = "0.1.0"
description = "Avodeck API (FastAPI) and background worker, one package"
requires-python = ">=3.12,<3.13"
dependencies = ["fastapi (>=0.143.3,<0.144.0)", "uvicorn[standard] (>=0.54.0,<0.55.0)", "psycopg[binary] (>=3.2,<4.0)", "psycopg-pool (>=3.2,<4.0)", "httpx (>=0.28.1,<0.29.0)", "pyjwt[crypto] (>=2.10,<3.0)", "pyyaml (>=6.0,<7.0)", "jsonschema-rs (>=0.58,<0.59)", "tzdata (>=2025.2)", "presidio-analyzer (>=2.2.364,<3.0.0)", "cryptography (>=44)", "sentry-sdk[fastapi] (>=2.72.0,<3.0.0)", "procrastinate (>=3.5,<4.0)", "pikepdf (>=10.17.0,<11.0.0)", "pypdfium2 (>=5.14.0,<6.0.0)", "pillow (>=13.0.0,<14.0.0)", "imagehash (>=4.3.2,<5.0.0)", "datasketch (>=2.0.0,<3.0.0)", "rapidfuzz (>=3.14.6,<4.0.0)", "dateparser (>=1.4.3,<2.0.0)", "python-docx (>=1.2.0,<2.0.0)"]

[tool.poetry]
packages = [{ include = "app" }]

[tool.poetry.group.dev.dependencies]
pytest = "^9.1.1"
pytest-cov = "^7.1.0"
ruff = "^0.17.1"
mypy = "^2.4.0"
schemathesis = "^4.31.1"
types-pyyaml = "^6.0.12.20260906"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
# "." first so a checkout (or a check_red_green worktree) imports its own `app`
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
# tests import shared helpers as `tests.support.*`; map files from api/ so each has one module name
mypy_path = "."
explicit_package_bases = true

[[tool.mypy.overrides]]
module = ["pypdfium2", "pypdfium2.*"]
ignore_missing_imports = true

[tool.coverage.report]
exclude_also = ['if __name__ == "__main__":']
